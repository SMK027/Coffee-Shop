version: '3.8'

services:
  app:
    build: .
    volumes:
      - ./storage:/var/www/html/storage
    environment:
      - APP_NAME=${APP_NAME:-Coffee Shop}
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - RECAPTCHA_MIN_SCORE=${RECAPTCHA_MIN_SCORE:-0.5}
      - JWT_SECRET=${JWT_SECRET:-}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - MAIL_MAILER=smtp
      - MAIL_HOST=${SMTP_HOST}
      - MAIL_PORT=${SMTP_PORT}
      - MAIL_USERNAME=${SMTP_USER}
      - MAIL_PASSWORD=${SMTP_PASS}
      - MAIL_ENCRYPTION=${SMTP_ENCRYPTION}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@app.local}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_NAME=${ADMIN_NAME:-Administrateur}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password}
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-coffee_shop}.rule=Host("${APP_HOST:-coffee.leofranz.fr}")'
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-coffee_shop}.entrypoints=websecure'
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-coffee_shop}.tls.certresolver=le'
      - 'traefik.http.services.${COMPOSE_PROJECT_NAME:-coffee_shop}.loadbalancer.server.port=80'
      - "traefik.docker.network=proxy"
    networks:
      - proxy
      - db_internal
    restart: unless-stopped

networks:
  proxy:
    external: true
  db_internal:
    external: true
